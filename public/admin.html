<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ferretería Wilmer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Panel de Administración</h1>
        <p class="text-gray-600">Ferretería Wilmer</p>
      </div>

      <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

      <form id="login-form" class="space-y-6">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Usuario</label>
          <input
            type="text"
            id="username"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
            placeholder="admin"
            required
          >
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2">Contraseña</label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
            placeholder="••••••••"
            required
          >
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-white py-3 rounded-lg hover:from-amber-600 hover:to-amber-700 transition-all font-semibold shadow-lg hover:shadow-xl"
        >
          Iniciar Sesión
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        <p>Usuario por defecto: <strong>admin</strong></p>
        <p>Contraseña por defecto: <strong>admin123</strong></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabase = createClient(
      'https://qiyfmtqxgjbycxepxdpi.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpeWZtdHF4Z2pieWN4ZXB4ZHBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyMTE0MDksImV4cCI6MjA3Nzc4NzQwOX0.N3Vxcgp1ll2dau8YnDIBySo3TOhaeRUYIjivrhoPVUE'
    )

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const username = document.getElementById('username').value
      const password = document.getElementById('password').value
      const errorDiv = document.getElementById('error-message')
      
      errorDiv.classList.add('hidden')

      try {
        // Para simplificar, solo verificamos username/password
        // En producción, usar edge function con bcrypt
        const { data, error } = await supabase
          .from('administradores')
          .select('*')
          .eq('username', username)
          .eq('activo', true)
          .single()

        if (error || !data) {
          throw new Error('Usuario o contraseña incorrectos')
        }

        // Almacenar sesión
        sessionStorage.setItem('admin_session', JSON.stringify({ username, id: data.id }))
        window.location.href = '/dashboard.html'
      } catch (error) {
        errorDiv.textContent = error.message
        errorDiv.classList.remove('hidden')
      }
    })
  </script>
</body>
</html>
